<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BusiP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F8F9FB;--ink:#1B2232;--ink2:#2A3244;--muted:#4C5466;--line:#E3E6EC;--line2:#EEF0F4;
  --brand:#2B3A67;--brand-soft:#EBEEF6;--brand-ink:#FFFFFF;
  --manual:#A86A12;--manual-bg:#FDF4E3;--calc:#2F63A8;--calc-bg:#EFF4FB;
  --neg:#C0392B;--pos:#2F7D57;--warn:#9A5B00;--warn-bg:#FFF5E1;--err-bg:#FDECEA;--info-bg:#F0F3F8;--ok-bg:#EAF6EF;
  --focus:#2F63A8;--r:10px;--r-sm:6px;
  font-family:"Manrope","Segoe UI",-apple-system,Roboto,Arial,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C;--surface:#191D26;--surface2:#1E232E;--ink:#E7EAF0;--ink2:#D5D9E2;--muted:#AAB1BF;--line:#2B313D;--line2:#232833;
  --brand-soft:#232A3D;--manual:#E3A84C;--manual-bg:#2E2414;--calc:#8DB4E8;--calc-bg:#1A2434;--neg:#F08A7E;--pos:#7ACB9E;--warn:#E9B451;--warn-bg:#2D2410;--err-bg:#33191A;--info-bg:#1C2230;--ok-bg:#16291F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151C;--surface:#191D26;--surface2:#1E232E;--ink:#E7EAF0;--ink2:#D5D9E2;--muted:#AAB1BF;--line:#2B313D;--line2:#232833;
  --brand-soft:#232A3D;--manual:#E3A84C;--manual-bg:#2E2414;--calc:#8DB4E8;--calc-bg:#1A2434;--neg:#F08A7E;--pos:#7ACB9E;--warn:#E9B451;--warn-bg:#2D2410;--err-bg:#33191A;--info-bg:#1C2230;--ok-bg:#16291F;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-size:16px;font-weight:500;line-height:1.55;font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:284px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brandbox{display:flex;gap:12px;align-items:center;padding:22px 20px 18px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brandbox b{display:block;font-size:16.5px;line-height:1.25;font-weight:700}
.brandbox small{color:var(--muted);font-size:13.5px}
.projbox{margin:0 16px 8px;display:flex;gap:6px;align-items:center}
.projbox select{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 8px;font-weight:600;font-size:15px}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2)}
.menu>summary::-webkit-details-marker{display:none}
.menu .drop{position:absolute;right:0;top:40px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 12px 32px rgba(20,25,40,.14);padding:6px;min-width:210px}
.menu .drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;cursor:pointer}
.menu .drop button:hover{background:var(--surface2)}
.menu .drop .danger{color:var(--neg)}
.nav{padding:6px 12px 24px}
.nav .home{margin-bottom:4px}
.nav h4{display:flex;align-items:center;gap:8px;margin:18px 8px 6px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.nav h4 span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12.5px}
.nav .ngrp{margin-top:10px}
.nav button.ghd{gap:9px;padding:8px 10px;font-size:13.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.nav button.ghd:hover{background:var(--surface2)}
.nav .ghd .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12.5px;letter-spacing:0;flex:none}
.nav .ghd .lbl{flex:1}
.nav .ghd .chev{width:15px;height:15px;color:var(--muted);transition:transform .15s}
.nav .ghd[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav .nsub{margin:2px 0 4px 19px;padding-left:8px;border-left:1px solid var(--line)}
.nav .nsl{font-size:13px;font-weight:600;color:var(--muted);margin:8px 10px 3px;letter-spacing:.02em}
.nav .nsub button{padding:6px 10px}
@media (prefers-reduced-motion:reduce){.nav .ghd .chev{transition:none}}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink2);padding:7px 10px;border-radius:7px;cursor:pointer;font-size:15.5px;font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav button .lbl{flex:1}
.nav .cnt{font-size:12.5px;font-weight:700;background:var(--err-bg);color:var(--neg);border-radius:10px;padding:0 7px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.crumb{font-size:15.5px;color:var(--ink2)}
.crumb b{color:var(--ink);font-weight:700}
.top .grow{flex:1}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;border-radius:6px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,25,40,.14)}
.status{font-size:14px;color:var(--muted);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:30px 32px 80px;max-width:1440px;width:100%}

h1{font-size:29.5px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:19.5px;margin:34px 0 12px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16.5px;margin:20px 0 10px;font-weight:700}
.lead{color:var(--ink2);margin:0 0 24px;max-width:72ch;font-size:16.5px}
.muted{color:var(--muted)}.small{font-size:14.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:130px}
.fld>span{font-size:14.5px;color:var(--ink2);font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:88px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:15px;color:var(--ink2)}
.btn:hover{border-color:#C3C9D5;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:3px 9px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-weight:700;font-size:14px;color:var(--ink2);background:var(--surface);position:sticky;top:0;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.tot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface2)}
tr.sub td{font-weight:700}
tr.grp td{font-weight:700;color:var(--ink);text-align:left;padding-top:18px}
tr.ind td:first-child{padding-left:28px;color:var(--ink2)}
td.neg,span.neg,b.neg{color:var(--neg)}

.cell{width:132px;text-align:right;border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:5px}
.cell:hover{border-color:var(--line);background:var(--surface)}
.cell.pct{width:80px}
.cell.lbl{width:100%;min-width:230px;text-align:left;font-weight:600}
.src-saisi{background:var(--surface2);border-color:var(--line)!important}
.src-calc{color:var(--calc);background:var(--calc-bg)}
.src-manuel{color:var(--manual);background:var(--manual-bg);font-weight:700;box-shadow:inset 0 -2px 0 var(--manual)}
.cell.inh{color:var(--muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);margin:0 0 12px;align-items:center}
.legend i{display:inline-block;width:22px;height:14px;vertical-align:-3px;margin-right:6px;border-radius:3px}
.lg-s{background:var(--surface2);border:1px solid var(--line)}.lg-c{background:var(--calc-bg)}.lg-m{background:var(--manual-bg);box-shadow:inset 0 -2px 0 var(--manual)}
.notes td{white-space:normal;text-align:left;font-size:14px;color:var(--warn);padding-top:0}
.detail td{white-space:normal;text-align:left;font-size:14px;color:var(--ink2);background:var(--surface2)}
.detail select{font-size:14px;padding:3px 6px;margin-left:6px}
.bulk{position:sticky;top:62px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.bulk .cell{border-color:var(--line);background:var(--surface)}
.bulk b{font-weight:700;margin-right:6px}
.bulk .sep{width:1px;height:22px;background:var(--line)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(20,25,40,.05);min-width:0}
.kpi span{display:inline-flex;align-items:center;gap:2px;background:var(--calc-bg);color:var(--calc);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.kpi span .help{margin-left:4px;background:transparent;border-color:currentColor;color:inherit}
.kpi b{display:block;font-size:28px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.15}
.kpi small{display:inline-block;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);border-radius:12px;padding:3px 12px;font-size:13.5px;font-weight:600;line-height:1.5}
.kpi.kneg span{background:var(--err-bg);color:var(--neg)}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.path button{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;align-items:flex-start}
.path button:hover{border-color:var(--brand)}
.path .n{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.path b{display:block;font-size:17px}
.path small{color:var(--ink2);font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:18px}
.grid2>*{min-width:0}
.alert{padding:10px 14px;border-radius:var(--r-sm);margin-bottom:8px;display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:15.5px}
.alert.err{background:var(--err-bg);color:var(--neg)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--ink2)}
.alert.ok{background:var(--ok-bg);color:var(--pos)}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:10px;padding:1px 8px;background:var(--line2);color:var(--muted)}
.tag.manuel{background:var(--manual-bg);color:var(--manual)}
.tag.auto{background:var(--calc-bg);color:var(--calc)}
.missing{color:var(--warn);font-size:14px;margin-top:4px}

.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;max-width:240px;font-weight:600;font-size:15px;color:var(--ink2)}
.steps button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.steps button small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.bpf{margin-bottom:20px}
.bpf .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bpf .hd input{font-weight:700;border-color:transparent;flex:1;background:none}
.bpf .hd input:hover{border-color:var(--line)}
.auto{background:var(--calc-bg);padding:12px 14px;border-radius:var(--r-sm);white-space:pre-wrap;line-height:1.6;color:var(--ink2)}
.help{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;cursor:help;margin-left:6px;background:var(--surface);padding:0;vertical-align:1px}
.help:hover{border-color:var(--brand);color:var(--brand)}
.pop{position:fixed;z-index:50;max-width:340px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r-sm);font-size:15px;line-height:1.55;box-shadow:0 14px 36px rgba(20,25,40,.18)}
.chart{width:100%;height:auto;display:block}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 13px 5px 11px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.3;transition:background .15s,border-color .15s,color .15s}
.chip.sm{padding:4px 11px}
.chip svg.i{width:15px;height:15px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 2px 6px rgba(20,25,40,.16)}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
.chartnote{margin:0 0 8px}
.chart text{fill:var(--ink2);font-size:14.5px;font-weight:600;font-family:inherit}
.season{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.season label{font-size:13px;color:var(--muted);text-align:center}
.season input{width:100%;text-align:center}
.card-h{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
details>summary{cursor:pointer;font-weight:600}
.doc{background:#fff;color:#1d2230;max-width:820px;margin:0 auto;padding:48px 56px;border:1px solid var(--line);border-radius:var(--r);line-height:1.65}
.doc h2{border-bottom:2px solid var(--brand);padding-bottom:6px;color:var(--brand)}
.doc table{font-size:13.5px}.doc th{color:#5a6273}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:8px;z-index:60;font-size:15px;font-weight:600}
.mobnav{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:420px;width:100%;box-shadow:0 18px 48px rgba(10,14,24,.28)}
.modal p{margin:0 0 14px}.modal input{width:100%;margin-bottom:14px}.modal .row{justify-content:flex-end}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobnav{display:block}
  .top{padding:10px 14px}
  .content{padding:20px 16px 60px}
  .bulk{position:static}
}
@media print{.side,.top,.noprint{display:none!important}.app{display:block}.doc{border:0;padding:0}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"></aside><div class="main"><header class="top" id="top"></header><main class="content" id="content"></main></div></div>
<script>
function bootError(m) { var c = document.getElementById('content') || document.body; var d = document.createElement('div'); d.className = 'alert err'; d.style.margin = '16px'; d.textContent = 'Le module n’a pas pu démarrer : ' + (m || 'erreur inconnue') + '. Rechargez la page.'; c.insertBefore(d, c.firstChild); }
window.addEventListener('error', function (e) { if (!window.__bpBooted || !document.querySelector('#content > *')) bootError(e.message); });
/* ===== Moteur de calcul unique : toutes les vues et tous les exports en dépendent ===== */
var BP = (function () {
  'use strict';
  var MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var CATS = {
    volumes: 'Volumes vendus', prix: 'Prix de vente unitaires', ca: 'Chiffre d’affaires saisi directement',
    variables: 'Charges variables', fixes: 'Charges fixes', effectifs: 'Effectifs', salaires: 'Salaires bruts annuels',
    dirigeant: 'Rémunération du dirigeant'
  };
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function num(v) { if (v === '' || v == null) return 0; var n = +v; return isFinite(n) ? n : 0; }
  function isSet(v) { return v !== null && v !== undefined && v !== '' && isFinite(+v); }
  function line(label, n, unit, kind, o) {
    o = o || {};
    return { id: uid(), label: label, n: n, unit: unit, kind: kind, g1: o.g1 == null ? null : o.g1, g2: o.g2 == null ? null : o.g2, o1: o.o1 == null ? null : o.o1, o2: o.o2 == null ? null : o.o2, base2: 'N1' };
  }
  function nf(v, d) { return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d == null ? 2 : d }).format(v).replace(/[\u202f\u00a0]/g, ' '); }

  /* Résolution d'une ligne d'hypothèse : N saisi, N+1 et N+2 calculés ou remplacés */
  function resolve(ln, cat, P) {
    var F = P.firstExMonths || 12;
    var ann = (ln.kind === 'flow' && F !== 12) ? 12 / F : 1;
    var G = (P.growth && P.growth[cat]) || {};
    var inh1 = !isSet(ln.g1), inh2 = !isSet(ln.g2);
    var g1 = num(inh1 ? G.g1 : ln.g1), g2 = num(inh2 ? G.g2 : ln.g2);
    var n = num(ln.n), b1 = n * ann;
    var m1 = isSet(ln.o1), m2 = isSet(ln.o2);
    var v1 = m1 ? num(ln.o1) : b1 * (1 + g1 / 100);
    var b2 = ln.base2 === 'N' ? b1 : v1;
    var v2 = m2 ? num(ln.o2) : b2 * (1 + g2 / 100);
    var notes = [];
    if (ann !== 1) notes.push('Premier exercice de ' + F + ' mois : la base de N+1 est N ramenée à 12 mois (' + nf(b1, 2) + ').');
    function chk(tag, man, b, g, v) {
      if (man) { if (b === 0) notes.push(tag + ' : montant manuel sur une base nulle, la variation n’est pas calculable.'); return; }
      if (g === 0) return;
      if (b === 0) notes.push(tag + ' : base nulle, la variation de ' + nf(g, 1) + ' % n’a aucun effet. Saisissez un montant manuel.');

function exportPdf() {

  function mix(c, t) { return c.map(function (v) { return Math.round(v + (255 - v) * t); }); }
  var TINT = mix(col, 0.9), TINT2 = mix(col, 0.95), SOFT = mix(col, 0.55), MID = mix(col, 0.45);
  var ML = 18, MR = 18, TOP = 26, y = TOP, toc = [], chapN = 0;
  function T(s) { return san(s); }
  function PW() { return doc.internal.pageSize.getWidth(); }
  function PH() { return doc.internal.pageSize.getHeight(); }
  function CW() { return PW() - ML - MR; }
  function BOT() { return PH() - 22; }
  function fill(c) { doc.setFillColor(c[0], c[1], c[2]); }
  function ink(c) { doc.setTextColor(c[0], c[1], c[2]); }
  function draw(c) { doc.setDrawColor(c[0], c[1], c[2]); }
  function font(s, z) { doc.setFont('helvetica', s); doc.setFontSize(z); }
  function newPage(o) { doc.addPage('a4', o || 'p'); y = TOP; }
  var capQ = null;
  function need(h) { var c0 = capQ; capQ = null; if (y + h + (c0 ? 6 : 0) > BOT()) newPage(PW() > PH() ? 'l' : 'p'); if (c0) { font('bold', 7.4); ink(MUT); doc.setCharSpace(0.3); doc.text(c0, ML, y); doc.setCharSpace(0); y += 4.1; } }

}
function loadLogo(file) {
